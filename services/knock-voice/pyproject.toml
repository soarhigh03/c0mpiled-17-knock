[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knock-voice"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "Server-only Pella v2 audio analysis sidecar for Knock"

[project.scripts]
knock-voice = "knock_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
